services:
  diamon:
    container_name: diamon
    # Build from this repo so local UI/code changes are served.
    # Upgrading from a setup where this service was called "wallos"? Run
    # `docker compose up -d --build --remove-orphans` once; the ./db and ./logos
    # volumes below are unchanged, so no data moves.
    build: .
    image: diamon-local
    ports:
      - "8282:80/tcp"
    environment:
      TZ: 'America/Bogota'
      # Optional OIDC environment variables
      # OIDC_ENABLED: "true"
      # OIDC_PROVIDER_NAME: "Authelia"
      # OIDC_CLIENT_ID: "diamon"
      # OIDC_CLIENT_SECRET: "replace-me"
      # OIDC_CLIENT_SECRET_FILE: "/run/secrets/diamon_oidc_secret"
      # OIDC_ISSUER: "https://auth.example.com"
      # OIDC_AUTH_URL: "https://auth.example.com/oauth2/authorize"
      # OIDC_TOKEN_URL: "https://auth.example.com/oauth2/token"
      # OIDC_USERINFO_URL: "https://auth.example.com/oauth2/userinfo"
      # OIDC_REDIRECT_URL: "https://diamon.example.com/index.php"
      # OIDC_LOGOUT_URL: "https://auth.example.com/logout"
      # OIDC_USER_IDENTIFIER: "sub"
      # OIDC_SCOPES: "openid email profile"
      # OIDC_AUTO_CREATE_USER: "true"
      # OIDC_DISABLE_PASSWORD_LOGIN: "false"
      # OIDC_REQUIRE_EMAIL_VERIFIED: "true"
      # Optional SSRF allowlist (overrides the Security Settings allowlist in the Admin UI)
      # SSRF_ALLOWLIST: "auth.example.com,192.168.1.100:8123"
    # Data lives in named Docker volumes, outside the git working tree, so
    # switching branches never touches the database or uploaded logos.
    # Back up with: docker run --rm -v diamon_db:/d -v ${PWD}:/b alpine tar czf /b/db.tgz -C /d .
    volumes:
      - 'diamon_db:/var/www/html/db'
      - 'diamon_logos:/var/www/html/images/uploads/logos'
    restart: unless-stopped

volumes:
  diamon_db:
    name: diamon_db
  diamon_logos:
    name: diamon_logos
